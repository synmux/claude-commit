version: 2
updates:
  - package-ecosystem: github-actions
    cooldown:
      default-days: 7
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 100
    assignees:
      - synmux
    groups:
      all-dependencies:
        patterns:
          - "*"
  - package-ecosystem: npm
    cooldown:
      default-days: 7
    directory: /
    ignore:
      # undici's major must match the undici bundled in the supported Node
      # (26 -> 8); a mismatched dispatcher fails every Ollama request.
      # Move it together with "engines" by hand.
      - dependency-name: undici
        update-types:
          - version-update:semver-major
    schedule:
      interval: daily
    open-pull-requests-limit: 100
    assignees:
      - synmux
    groups:
      all-dependencies:
        patterns:
          - "*"
