# syn-version: 1789415892
# Publishes @synmux/claude-commit to the npm registry whenever a version tag
# (e.g. 0.1.3) is pushed.
#
# Job chain: verify-tag -> ci -> publish. The `ci` job runs ci.yml as a
# reusable workflow (lint, typecheck, build, test) against the tagged commit,
# so nothing reaches npm unless the same checks that guard every push pass.
#
# Authentication uses npm trusted publishing (OIDC) — no NPM_TOKEN secret.
# One-time setup on npmjs.com: package Settings → Trusted Publisher →
# GitHub Actions, with organisation `synmux`, repository `claude-commit`,
# workflow filename `publish.yml`, and the environment field left blank.

name: Publish to npm

permissions:
  contents: read
  id-token: write # mint the OIDC token npm exchanges for publish credentials

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - v[0-9]*.[0-9]*.[0-9]*

jobs:
  # Fail fast on a mistagged commit before spending minutes on CI.
  verify-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Verify tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(jq -r .version package.json)"
          if [ "${tag_version}" != "${package_version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${package_version}" >&2
            exit 1
          fi

  ci:
    needs: verify-tag
    permissions: read-all # what ci.yml grants itself when run standalone
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      # Node 24 bundles npm >= 11.5.1, the minimum for OIDC trusted publishing.
      # Deliberately no `registry-url` here: it writes an .npmrc that expects a
      # NODE_AUTH_TOKEN env var, which breaks tokenless OIDC publishes.
      - name: Set up Node.js for npm publish
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Reads the pinned version from package.json's `packageManager` field.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      # `prepublishOnly` builds dist/ (bundle + declarations) before npm packs.
      - name: Publish to npm
        run: npm publish --access public
