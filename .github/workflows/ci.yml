# syn-version: 1789415892
name: ci
permissions:
  contents: read
  pull-requests: read
on:
  push: null
  pull_request: null
  workflow_call: null # publish.yml runs this before releasing to npm
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        # nb: runs `pnpm install` itself, no need for a separate install step
        with:
          runtime: node@26
          cache: true
      - name: trunk
        uses: trunk-io/trunk-action@e1234e67a86010d61ddac8d8ebf4b783e2ffd2fa # v2.0.0
      - name: typecheck
        run: pnpm run lint:types
      - name: build
        run: pnpm run build
      - name: test
        run: pnpm run test
